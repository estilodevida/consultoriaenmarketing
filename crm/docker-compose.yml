name: twenty

networks:
  crm-network:
    driver: bridge

services:
  server:
    image: twentycrm/twenty:${TAG:-latest}
    entrypoint: ["/entrypoint-wrapper.sh"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
      - ./entrypoint.sh:/entrypoint-wrapper.sh
      - ./keys/access-key.pem:/run/secrets/access-key.pem
      - ./keys/login-key.pem:/run/secrets/login-key.pem
      - ./keys/refresh-key.pem:/run/secrets/refresh-key.pem
    ports:
      - "3010:3000"
    networks:
      - crm-network
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS}

      STORAGE_TYPE: ${STORAGE_TYPE}

      APP_SECRET: ${APP_SECRET:-replace_me_with_a_random_string}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  worker:
    image: twentycrm/twenty:${TAG:-latest}
    entrypoint: ["/entrypoint-wrapper.sh"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
      - ./entrypoint.sh:/entrypoint-wrapper.sh
      - ./keys/access-key.pem:/run/secrets/access-key.pem
      - ./keys/login-key.pem:/run/secrets/login-key.pem
      - ./keys/refresh-key.pem:/run/secrets/refresh-key.pem
    command: ["yarn", "worker:prod"]
    networks:
      - crm-network
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"

      STORAGE_TYPE: ${STORAGE_TYPE}

      APP_SECRET: ${APP_SECRET:-replace_me_with_a_random_string}

    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - crm-network
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: always

  redis:
    image: redis
    networks:
      - crm-network
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  server-local-data:
